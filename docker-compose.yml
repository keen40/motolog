# MotoLog behind the host's Tailscale.
# The container port is published on 127.0.0.1 only; expose it on the tailnet with:
#   sudo tailscale serve --bg --https=8451 http://127.0.0.1:3010
# `tailscale serve` adds the Tailscale-User-* headers the app uses to identify people.
# Never publish this port on 0.0.0.0 or enable Funnel: the app trusts those headers.

services:
  app:
    build: .
    image: motolog:latest
    container_name: motolog
    ports:
      - "127.0.0.1:${MOTOLOG_PORT:-3010}:3000"
    environment:
      - AUTH_MODE=${AUTH_MODE:-tailscale}
      # Listen on the container interface; the host side is still loopback-only (see ports).
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/data
    restart: unless-stopped
