# MotoLog behind the host's Tailscale.
# The container port is published on 127.0.0.1 only; expose it on the tailnet with:
#   sudo tailscale serve --bg --https=8451 http://127.0.0.1:3010
# `tailscale serve` adds the Tailscale-User-* headers the app uses to identify people.
# Never publish this port on 0.0.0.0 or enable Funnel: the app trusts those headers.

services:
  app:
    build: .
    image: motolog:latest
    container_name: motolog
    ports:
      - "127.0.0.1:${MOTOLOG_PORT:-3010}:3000"
    environment:
      - AUTH_MODE=${AUTH_MODE:-tailscale}
      # Listen on the container interface; the host side is still loopback-only (see ports).
      - HOSTNAME=0.0.0.0
      # AI catalogue lookups (optional) – set these in .env next to this file
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-luna}
      - AI_MONTHLY_LOOKUPS=${AI_MONTHLY_LOOKUPS:-20}
      - AI_MAX_SEARCHES=${AI_MAX_SEARCHES:-12}
      # Public access through Cloudflare Tunnel + Access (optional, see README "Access without the tailnet")
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - IDENTITY_ALIASES=${IDENTITY_ALIASES:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Cloudflare Tunnel: an outbound connection to Cloudflare, so nothing is opened on this server.
  # Only started with COMPOSE_PROFILES=public in .env. Cloudflare Access in front of it does the login;
  # the app verifies the Access token itself. In the tunnel's public hostname, point it at http://app:3000.
  tunnel:
    image: cloudflare/cloudflared:2026.10.2
    container_name: motolog-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["public"]
